      /* ------------------------------------------------------------------
         Named keyframe animations (as listed on the source page).
      ------------------------------------------------------------------ */
      @keyframes AppFrame-a11yLink-focus {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes tooltip-appear {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);

      }
      @keyframes fade-in {

          opacity: 0;
        }

        }
      }
      @keyframes fade-out {
        from {
          opacity: 1;

          opacity: 0;
        }

      @keyframes fade-up {

      @keyframes fade-down {
        from {

          transform: translateY(0);

      @keyframes grow-x {

        }

        .reveal {

        }

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef, useCallback } = React;

      /* Asset URLs (verified) — used directly, no local copies. */
      const ASSETS = {
        logo: 'https://images.ctfassets.net/8aevphvgewt8/2xNJHobFMxrvAwj534sNMo/753fcd3beb5fd223d1d2ed918b868a5f/figma.svg',

        plan: 'https://images.ctfassets.net/8aevphvgewt8/1uXZYDy7dMcH9QwxuAU06F/1cb167cc60d725b8cf7089faf9a4ed06/accordion-2-730955545f07.webp',
        collaborate: 'https://images.ctfassets.net/8aevphvgewt8/3xzVZaJhqo3B62R8NeHjX2/e37c81e4f26e9dac2aff1f23a0243087/accordion-3-52ca331d22ea.webp',
        secure: 'https://images.ctfassets.net/8aevphvgewt8/3cgNgdKFqflI27vyDh4Gpa/c459dc8690133e7663b8db2626cf2045/accordion-4-a26744b70ff7.webp',
        automate: 'https://images.ctfassets.net/8aevphvgewt8/20DkYnWbPsbb8mdDnIs32f/a43850b7e0e8e45ec87761d1ba91e19b/accordion-2-c0a62cfc31a1.webp',
        scale: 'https://images.ctfassets.net/8aevphvgewt8/39mo3IRGhK995HzuwZANhY/cabfd393551e0d2aae92bc105121ca9c/accordion-3-5d5d222f1830.webp',
      };

      /* Scroll reveal: adds .is-visible once, so fade-up runs on entry. */
      function useReveal() {
        const ref = useRef(null);
        useEffect(() => {
          const root = ref.current || document;
          const nodes = root.querySelectorAll('.reveal:not(.is-visible)');
          if (!('IntersectionObserver' in window)) {
            nodes.forEach((n) => n.classList.add('is-visible'));
            return undefined;
          }
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add('is-visible');
                  io.unobserve(entry.target);
                }
              });
            },
            { rootMargin: '0px 0px -10% 0px', threshold: 0.08 },
          );
          nodes.forEach((n) => io.observe(n));
          return () => io.disconnect();
        }, []);
        return ref;
      }

      /* Email capture → GitHub's real sign-up flow; status alert fades in/out. */
      function SignupForm({ idPrefix, compact }) {
        const [status, setStatus] = useState('idle');
        const timers = useRef([]);
        useEffect(() => () => timers.current.forEach(clearTimeout), []);
        const onSubmit = (event) => {
          event.preventDefault();
          setStatus('in');
          timers.current.forEach(clearTimeout);
          timers.current = [
            setTimeout(() => setStatus('out'), 3600),
            setTimeout(() => setStatus('idle'), 4000),
          ];
        };
        return (
          <div className={compact ? '' : 'w-full'}>
            <form
              className="glass flex flex-col gap-3 rounded-shell border border-glassline p-3 sm:flex-row sm:items-center"
              onSubmit={onSubmit}
            >
              <div className="relative min-w-0 flex-1">
                <input
                  id={`${idPrefix}-email`}
                  className="input capsule-input w-full"
                  type="email"
                  name="email"
                  placeholder=" "
                  autoComplete="email"
                  required
                  aria-label="Enter your email"
                />
                <label htmlFor={`${idPrefix}-email`} className="capsule-label">
                  Enter your email
                </label>
              </div>
              <button className="button-green shrink-0" type="submit">
                Sign up for GitHub
              </button>
            </form>
            <div aria-live="polite" className="min-h-[21px]">
              {status !== 'idle' && (
                <p
                  className={`mt-2 inline-block rounded-btn border border-glassline bg-canvas px-3 py-1 text-[14px] leading-[21px] text-white ${
                    status === 'in' ? 'anim-in' : 'anim-out'
                  }`}
                >
                  Nice — check your inbox to finish signing up.
                </p>
              )}
            </div>
          </div>
        );
      }
      /* Sticky glass header — fades down on load. */

      /* Footer — background #0f1511 with the inset top edge shadow. */

        {
          heading: 'Resources',
          links: [
            'Roadmap',
            'Compare GitHub',
            'Ecosystem',
            'Developer API',
            'Partners',
            'Education',
            'GitHub CLI',
            'GitHub Desktop',
            'GitHub Mobile',

        {

            'Docs',
            'Community Forum',
            'Professional Services',
            'Premium Support',
            'Skills',
            'Status',

            'Careers',

      const SOCIAL = ['LinkedIn', 'Instagram', 'YouTube', 'X', 'TikTok', 'Twitch', 'GitHub'];

      function Footer() {
        return (
          <footer
            className="bg-footerbed shadow-edge"
            aria-label="Site-wide Links"
            style={{ boxShadow: 'rgb(25, 31, 27) 0px -1px 0px 0px inset' }}

            <div className="frame py-16">
              <div className="grid gap-12 lg:grid-cols-[420px_1fr]">

                        {column.links.map((link) => (

                              {link}

              <div className="mt-12 flex flex-col gap-4 border-t border-hairline/40 pt-8 lg:flex-row lg:items-center">

                  <li>© 2026 GitHub, Inc.</li>
                  <li>
                    <a href="#future">Terms</a>
                  </li>
                  <li>
                    <a href="#future">Privacy</a>
                  </li>
                  <li>
                    <a href="#future">Manage cookies</a>
                  </li>
                  <li>
                    <a href="#future">Do not share my personal information</a>
                  </li>
                </ul>
                <ul className="flex flex-wrap items-center gap-x-6 gap-y-2 text-[14px] leading-[21px] lg:ml-auto">
                  {SOCIAL.map((name) => (
                    <li key={name}>
                      <a href="#future" data-tip={`GitHub on ${name}`}>
                        {name}
                      </a>
                    </li>
                  ))}
                </ul>
                <button className="button-nav border border-glassline" type="button" data-tip="Change language">
                  English
                </button>
              </div>
            </div>
          </footer>
        );
      }
      /* Signup section — multi-step flow: Account → Platform → Company → Team. */
      const SIGNUP_STEPS = [
        {
          id: 'account',
          title: 'Tell us about yourself',
          subtitle: 'First, create your GitHub login.',
          fields: [
            {
              name: 'fullName',
              label: 'Full name',
              type: 'text',
              placeholder: 'Ada Lovelace',
              autoComplete: 'name',
            },
            {
              name: 'username',
              label: 'Username',
              type: 'text',
              placeholder: 'adalovelace',
              autoComplete: 'username',
            },
            {
              name: 'email',
              label: 'Email',
              type: 'email',
              placeholder: 'you@example.com',
              autoComplete: 'email',
            },
            {
              name: 'password',
              label: 'Password',
              type: 'password',
              placeholder: 'At least 8 characters',
              autoComplete: 'new-password',
            },
          ],
        },
        {
          id: 'platform',
          title: 'Your platform',
          subtitle: 'What are you building on GitHub?',
          radios: [
            {
              label: 'Open source',
              hint: 'Build in public with the open source community.',
            },
            {
              label: 'Business',
              hint: 'Ship software for a company or startup.',
            },
            {
              label: 'Personal',
              hint: 'Learn, experiment, and run side projects.',
            },
          ],
          fields: [
            {
              name: 'platformName',
              label: 'Platform / product name',
              type: 'text',
              placeholder: 'Acme Cloud',
            },
            {
              name: 'industry',
              label: 'Industry',
              type: 'select',
              options: [
                'Technology',
                'Financial services',
                'Healthcare',
                'Manufacturing',
                'Government',
                'Education',
                'Other',
              ],
            },
          ],
        },
        {
          id: 'company',
          title: 'Your company',
          subtitle: 'Where do you work?',
          fields: [
            { name: 'companyName', label: 'Company name', type: 'text', placeholder: 'Acme Inc.' },
            {
              name: 'companySize',
              label: 'Company size',
              type: 'select',
              options: ['1–10', '11–50', '51–200', '201–1000', '1001+'],
            },
            {
              name: 'country',
              label: 'Country / region',
              type: 'select',
              options: [
                'United States',
                'United Kingdom',
                'Germany',
                'India',
                'Japan',
                'Brazil',
                'Other',
              ],
            },
          ],
        },
        {
          id: 'team',
          title: 'Your teams',
          subtitle: 'Who will you work with day to day?',
          fields: [
            {
              name: 'teamName',
              label: 'Team name',
              type: 'text',
              placeholder: 'Platform engineering',
            },
            {
              name: 'teamSize',
              label: 'Developers on the team',
              type: 'select',
              options: ['1–10', '11–50', '51–200', '200+'],
            },
            {
              name: 'role',
              label: 'Your role',
              type: 'select',
              options: [
                'Engineer',
                'Engineering manager',
                'DevOps / SRE',
                'Security',
                'Product',
                'Other',
              ],
            },
            {
              name: 'useCase',
              label: 'Primary use case',
              type: 'select',
              options: [
                'CI/CD',
                'Application security',
                'AI-assisted development',
                'Project planning',
                'All of the above',
              ],
            },
          ],
        },
      ];
      function SignupSection() {
        const [step, setStep] = useState(0);
        const [done, setDone] = useState(false);
        const [values, setValues] = useState({ purpose: 'Business' });
        const data = SIGNUP_STEPS[step];
        const update = (name) => (event) =>
          setValues((v) => ({ ...v, [name]: event.target.value }));
        const onSubmit = (event) => {
          event.preventDefault();
          if (step < SIGNUP_STEPS.length - 1) {
            setStep(step + 1);
          } else {
            setDone(true);
          }
        };
        return (
          <section
            id="signup"
            aria-labelledby="signup-title"
            className="relative scroll-mt-16 overflow-hidden border-t border-hairline/40"
          >
            <div
              aria-hidden="true"
              className="absolute inset-0"
              style={{
                background:
                  'radial-gradient(700px 320px at 50% 0%, rgba(68,147,248,0.12), transparent 60%), #0d1117',
              }}
            />
            <div className="frame relative py-16 md:py-24">
              <div className="reveal mx-auto max-w-narrow text-center">
                <h2 id="signup-title" className="display">
                  Sign up for free
                </h2>
                <p className="mt-6 text-[18px] leading-[27px] text-[#ffffffd9]">
                  Tell us about your platform, company, and teams, and we’ll tailor GitHub to fit
                  how you build.
                </p>
              </div>

              <div
                className="reveal mx-auto mt-10 w-full max-w-col"
                style={{ animationDelay: '80ms' }}
              >
                {/* Step progress */}
                <ol className="flex gap-3" aria-label="Sign up progress">
                  {SIGNUP_STEPS.map((item, index) => (
                    <li key={item.id} className="flex-1">
                      <div
                        className={`h-1 rounded-pill ${
                          index <= step || done ? 'bg-[#4493f8]' : 'bg-hairline/60'
                        } progress-fill`}
                        style={{ flexGrow: 1 }}
                      />
                      <span
                        className={`mt-2 block text-[12px] leading-[16px] ${
                          index <= step || done ? 'text-white' : 'text-muted'
                        }`}
                      >
                        {item.title}
                      </span>
                    </li>
                  ))}
                </ol>

                <div className="card mx-auto mt-8 max-w-narrow rounded-shell p-6 md:p-8">
                  {done ? (
                    <div className="step-enter py-6 text-center" role="status">
                      <svg
                        aria-hidden="true"
                        width="48"
                        height="48"
                        viewBox="0 0 16 16"
                        fill="#3fb950"
                        className="mx-auto"
                      >
                        <path d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z" />
                      </svg>
                      <h3 className="h2 mt-4">
                        Welcome aboard{values.fullName ? `, ${values.fullName}` : ''}!
                      </h3>
                      <p className="mt-2 text-muted">
                        Your account{values.platformName ? ` for ${values.platformName}` : ''} is
                        ready. We sent a confirmation to {values.email || 'your inbox'}.
                      </p>
                      <div className="mt-6 flex flex-wrap justify-center gap-3">
                        <a className="button-green" href="#future">
                          Explore GitHub
                        </a>
                        <a
                          className="button-nav"
                          href={DEMO_PAGE}
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          Try demo
                        </a>
                      </div>
                    </div>
                  ) : (
                    <form
                      key={data.id}
                      className="step-enter grid gap-5"
                      aria-label={data.title}
                      onSubmit={onSubmit}
                    >
                      <div>
                        <p className="text-[12px] uppercase tracking-widest text-muted">
                          Step {step + 1} of {SIGNUP_STEPS.length}
                        </p>
                        <h3 className="h2 mt-1">{data.title}</h3>
                        <p className="mt-1 text-muted">{data.subtitle}</p>
                      </div>
                      {data.radios && (
                        <fieldset>
                          <legend className="text-[14px] font-semibold text-white">
                            What will you use GitHub for?
                          </legend>
                          <div className="mt-2 grid gap-2 sm:grid-cols-3">
                            {data.radios.map((radio) => {
                              const active = values.purpose === radio.label;
                              return (
                                <label
                                  key={radio.label}
                                  className={`cursor-pointer rounded-btn border p-3 transition-colors duration-150 ${
                                    active
                                      ? 'border-[#4493f8] bg-[#4493f8]/10'
                                      : 'border-hairline/60 hover:border-muted'
                                  }`}
                                >
                                  <input
                                    type="radio"
                                    name="purpose"
                                    value={radio.label}
                                    checked={active}
                                    onChange={update('purpose')}
                                    className="sr-only"
                                  />
                                  <span className="block text-[14px] font-semibold text-white">
                                    {radio.label}
                                  </span>
                                  <span className="mt-1 block text-[12px] leading-[16px] text-muted">
                                    {radio.hint}
                                  </span>
                                </label>
                              );
                            })}
                          </div>
                        </fieldset>
                      )}

                      <div className="grid gap-5 sm:grid-cols-2">
                        {data.fields.map((field) => (
                          <div key={field.name}>
                            <label
                              htmlFor={`su-${field.name}`}
                              className="mb-1 block text-[14px] font-semibold text-white"
                            >
                              {field.label}
                            </label>
                            {field.type === 'select' ? (
                              <select
                                id={`su-${field.name}`}
                                name={field.name}
                                className="input w-full [color-scheme:dark]"
                                required
                                value={values[field.name] || ''}
                                onChange={update(field.name)}
                              >
                                <option value="" disabled>
                                  Select…
                                </option>
                                {field.options.map((option) => (
                                  <option key={option} value={option}>
                                    {option}
                                  </option>
                                ))}
                              </select>
                            ) : (
                              <input
                                id={`su-${field.name}`}
                                name={field.name}
                                type={field.type}
                                placeholder={field.placeholder}
                                autoComplete={field.autoComplete}
                                className="input w-full"
                                required
                                value={values[field.name] || ''}
                                onChange={update(field.name)}
                              />
                            )}
                          </div>
                        ))}
                      </div>

                      {step === SIGNUP_STEPS.length - 1 && (
                        <label className="flex items-start gap-2 text-[14px] leading-[21px] text-muted">
                          <input
                            type="checkbox"
                            required
                            className="mt-1 h-4 w-4 accent-[#238636]"
                          />
                          <span>
                            I agree to the{' '}
                            <a className="text-sky" href="#future">
                              Terms of Service
                            </a>{' '}
                            and{' '}
                            <a className="text-sky" href="#future">
                              Privacy Statement
                            </a>
                            .
                          </span>
                        </label>
                      )}

                      <div className="mt-2 flex items-center justify-between gap-3">
                        {step > 0 ? (
                          <button
                            type="button"
                            className="button-nav"
                            onClick={() => setStep(step - 1)}
                          >
                            Back
                          </button>
                        ) : (
                          <span aria-hidden="true" />
                        )}
                        <button type="submit" className="button-green">
                          {step < SIGNUP_STEPS.length - 1 ? 'Continue' : 'Create account'}
                        </button>
                      </div>
                    </form>
                  )}
                </div>

                <p className="mt-6 text-center text-[14px] leading-[21px] text-muted">
                  Already have an account?{' '}
                  <a
                    className="text-sky"
                    href={DEMO_PAGE}
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Sign in
                  </a>
                </p>
              </div>
            </div>
          </section>
        );
      }

      function App() {
        const ref = useReveal();
        return (
          <div ref={ref}>
            <Header />
            <main id="main">
              <FutureSection />
              <AccelerateSection />
              <SecuritySection />
              <TogetherSection />
              <ScaleSection />
              <HomeSection />
              <SignupSection />
            </main>
            <Footer />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
