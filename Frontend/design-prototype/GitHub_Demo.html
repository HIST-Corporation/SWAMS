<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to GitHub · GitHub</title>
    <meta
      name="description"
      content="The world's most widely adopted developer platform demo — for now, the sign-in page."
    />
    <link
      rel="icon"
      href="https://github.githubassets.com/favicons/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="https://github.githubassets.com/assets/mona-sans-vf-400.woff2"
    />
    <style>
      @font-face {
        font-family: 'Mona Sans';
        font-style: normal;
        font-display: swap;
        font-weight: 400 700;
        src:
          url('https://github.githubassets.com/assets/mona-sans-vf-400.woff2') format('woff2-variations');
      }

      :root {
        --base-duration-150: 150ms;
        --base-duration-200: 200ms;
        --base-duration-300: 300ms;
        --base-easing: cubic-bezier(0.3, 0, 0.2, 1);
        --base-easing-easeOut: cubic-bezier(0, 0, 0.2, 1);
        --color-canvas-default: #0d1117;
        --color-canvas-subtle: #161b22;
        --color-border-default: #3d444d;
        --color-border-muted: #21262d;
        --color-fg-default: #e6edf3;
        --color-fg-muted: #8b949e;
        --color-fg-subtle: #6e7681;
        --color-accent-fg: #4493f8;
        --color-success-emphasis: #238636;
        --color-success-hover: #2ea043;
        --color-danger-fg: #ff7b72;
        --color-danger-emphasis: #cf222e;
        --focus-ring: 0 0 0 3px rgba(88, 166, 255, 0.3);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--color-canvas-default);
        color: var(--color-fg-default);
        font-family:
          'Mona Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Noto Sans',
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        line-height: 21px;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .skip-link {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translate(-50%, -80%);
        z-index: 100;
        padding: 8px 12px;
        border-radius: 6px;
        background: var(--color-accent-fg);
        color: #fff;
        font-size: 14px;
        text-decoration: none;
        transition: transform var(--base-duration-200) var(--base-easing-easeOut);
      }
      .skip-link:focus {
        transform: translate(-50%, 8px);
        outline: none;
      }

      a {
        color: var(--color-accent-fg);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      .container {
        width: 100%;
        max-width: 340px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }

      .anim-fade-in {
        animation: fade-in var(--base-duration-300) var(--base-easing) both;
      }
      .anim-fade-in-late {
        animation: fade-in var(--base-duration-300) var(--base-easing) both;
        animation-delay: 80ms;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .logo {
        display: flex;
        justify-content: center;
        margin: 8px 0 16px;
      }
      .logo svg {
        fill: var(--color-fg-default);
      }
      .logo a {
        display: inline-flex;
        transition: opacity var(--base-duration-200) var(--base-easing);
      }
      .logo a:hover {
        opacity: 0.8;
        text-decoration: none;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        text-align: center;
        color: var(--color-fg-default);
      }

      /* Flash messages (GitHub .flash) */
      .flash {
        display: none;
        margin: 0 0 16px;
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid transparent;
        font-size: 14px;
        line-height: 21px;
        animation: fade-in var(--base-duration-200) var(--base-easing) both;
      }
      .flash.is-visible {
        display: block;
      }
      .flash-error {
        background: rgba(248, 81, 73, 0.15);
        border-color: var(--color-danger-emphasis);
        color: var(--color-danger-fg);
      }
      .flash-info {
        background: var(--color-canvas-subtle);
        border-color: var(--color-border-default);
        color: var(--color-fg-muted);
      }

      .box {
        border: 1px solid var(--color-border-default);
        border-radius: 6px;
        padding: 16px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 400;
        color: var(--color-fg-default);
      }
      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .label-row a {
        font-size: 12px;
        color: var(--color-accent-fg);
      }

      input[type='text'],
      input[type='password'] {
        width: 100%;
        height: 34px;
        padding: 5px 12px;
        margin-bottom: 16px;
        font-family: inherit;
        font-size: 14px;
        line-height: 20px;
        color: var(--color-fg-default);
        background: var(--color-canvas-default);
        border: 1px solid var(--color-border-default);
        border-radius: 6px;
        outline: none;
        appearance: none;
        transition:
          border-color var(--base-duration-150) var(--base-easing),
          box-shadow var(--base-duration-150) var(--base-easing);
      }
      input[type='text']:hover,
      input[type='password']:hover {
        border-color: var(--color-fg-muted);
      }
      input[type='text']:focus,
      input[type='password']:focus {
        border-color: var(--color-accent-fg);
        box-shadow: var(--focus-ring);
      }
      input.is-error {
        border-color: var(--color-danger-emphasis);
      }
      input.is-error:focus {
        box-shadow: 0 0 0 3px rgba(207, 34, 46, 0.3);
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 34px;
        padding: 5px 16px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
        color: #fff;
        border: 1px solid rgba(240, 246, 252, 0.1);
        border-radius: 6px;
        cursor: pointer;
        transition: background var(--base-duration-150) var(--base-easing);
      }
      .btn-green {
        background: var(--color-success-emphasis);
      }
      .btn-green:hover {
        background: var(--color-success-hover);
      }
      .btn-green:active {
        background: #2c974b;
      }
      .btn:focus-visible {
        outline: 2px solid var(--color-accent-fg);
        outline-offset: 2px;
      }

      .new-account {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--color-border-muted);
        font-size: 12px;
        color: var(--color-fg-muted);
        text-align: left;
      }
      .new-account a {
        font-size: 12px;
      }

      .passkey {
        margin-top: 16px;
      }

      footer {
        margin-top: auto;
        padding: 24px 16px;
        color: var(--color-fg-subtle);
        font-size: 12px;
        line-height: 16px;
      }
      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .footer-links a {
        color: var(--color-accent-fg);
        font-size: 12px;
      }
      .lang {
        display: flex;
        justify-content: center;
        margin-top: 16px;
      }
      .lang button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        font-family: inherit;
        font-size: 12px;
        color: var(--color-fg-subtle);
        background: none;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: color var(--base-duration-150) var(--base-easing);
      }
      .lang button:hover {
        color: var(--color-accent-fg);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#login">Skip to content</a>

    <main class="container">
      <div class="logo anim-fade-in">
        <a href="GitHub_Landing.html" aria-label="GitHub home (back to landing page)">
          <svg
            height="96"
            width="96"
            viewBox="0 0 16 16"
            aria-hidden="true"
          >
            <path
              d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
            />
          </svg>
        </a>
      </div>

      <h1 class="anim-fade-in">Sign in to GitHub</h1>

      <div
        id="flash"
        class="flash flash-error"
        role="alert"
        aria-live="assertive"
      ></div>

      <div class="box anim-fade-in-late" id="login">
        <form id="login-form" novalidate>
          <label for="login-field">Username or email address</label>
          <input
            id="login-field"
            name="login"
            type="text"
            autocomplete="username"
            aria-label="Username or email address"
          />

          <div class="label-row">
            <label for="password">Password</label>
            <a href="#forgot" onclick="return false;">Forgot password?</a>
          </div>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            aria-label="Password"
          />

          <button class="btn btn-green" type="submit">Sign in</button>
        </form>

        <p class="new-account">
          New to GitHub? <a href="GitHub_Landing.html#signup">Create an account</a>
        </p>
      </div>

      <button id="passkey" class="btn btn-green passkey" type="button">
        <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M4.5 3A2.5 2.5 0 0 0 2 5.5v2A2.5 2.5 0 0 0 4.5 10H5v.5a.5.5 0 0 0 1 0V10h4v.5a.5.5 0 0 0 1 0V10h.5A2.5 2.5 0 0 0 14 7.5v-2A2.5 2.5 0 0 0 11.5 3h-7ZM3 5.5a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm6.5 1.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"
          />
        </svg>
        Sign in with a passkey
      </button>
    </main>

    <footer>
      <ul class="footer-links">
        <li><a href="GitHub_Landing.html">© 2026 GitHub, Inc.</a></li>
        <li><a href="GitHub_Landing.html#future">Terms</a></li>
        <li><a href="GitHub_Landing.html#future">Privacy</a></li>
        <li><a href="GitHub_Landing.html#future">Docs</a></li>
        <li><a href="GitHub_Landing.html#future">Contact GitHub Support</a></li>
        <li><a href="GitHub_Landing.html#future">Manage cookies</a></li>
        <li><a href="GitHub_Landing.html#future">Do not share my personal information</a></li>
      </ul>
      <div class="lang">
        <button type="button" aria-label="Select language">
          <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM5.78 8.75a9.64 9.64 0 0 0 1.363 4.177c.255.426.542.832.857 1.215.245-.296.551-.705.857-1.215A9.64 9.64 0 0 0 10.22 8.75Zm4.44-1.5a9.64 9.64 0 0 0-1.363-4.177c-.307-.51-.612-.919-.857-1.215a9.927 9.927 0 0 0-.857 1.215A9.64 9.64 0 0 0 5.78 7.25Zm-5.944 1.5H1.543a6.507 6.507 0 0 0 4.666 5.5c-.123-.181-.24-.365-.352-.552-.715-1.192-1.437-2.874-1.581-4.948Zm-2.733-1.5h2.733c.144-2.074.866-3.756 1.58-4.948.12-.197.237-.381.353-.552a6.507 6.507 0 0 0-4.666 5.5Zm10.181 1.5c-.144 2.074-.866 3.756-1.58 4.948-.12.197-.237.381-.353.552a6.507 6.507 0 0 0 4.666-5.5Zm2.733-1.5a6.507 6.507 0 0 0-4.666-5.5c.116.171.233.355.353.552.714 1.192 1.436 2.874 1.58 4.948Z"
            />
          </svg>
          English
        </button>
      </div>
    </footer>
    <script>
      (function () {
        var flash = document.getElementById('flash');
        var form = document.getElementById('login-form');
        var login = document.getElementById('login-field');
        var password = document.getElementById('password');

        function showFlash(kind, message) {
          flash.className = 'flash flash-' + kind + ' is-visible';
          flash.textContent = message;
        }
        function clearFlash() {
          flash.className = 'flash flash-error';
          flash.textContent = '';
          login.classList.remove('is-error');
          password.classList.remove('is-error');
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          login.value = login.value.trim();
          if (!login.value || !password.value) {
            if (!login.value) login.classList.add('is-error');
            if (!password.value) password.classList.add('is-error');
            showFlash('error', 'Incorrect username or password.');
            return;
          }
          login.classList.remove('is-error');
          password.classList.remove('is-error');
          showFlash(
            'info',
            'This is a demo sign-in page — authentication is not wired up yet.'
          );
        });

        login.addEventListener('input', clearFlash);
        password.addEventListener('input', clearFlash);

        document.getElementById('passkey').addEventListener('click', function () {
          showFlash('info', 'Passkey sign-in is not available in this demo yet.');
        });

        login.focus();
      })();
    </script>
  </body>
</html>
